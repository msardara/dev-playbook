---
# Configure the dotfiles
configure_dotfiles: true
dotfiles_repo: https://github.com/msardara/dotfiles.git
dotfiles_repo_version: main
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/.dotfiles
dotfiles_home: "~"
dotfiles_files:
  - .aliases
  - .bash_profile
  - .bash_prompt
  - .bashrc
  - .curlrc
  - .editorconfig
  - .exports
  - .extra
  - .functions
  - .gdbinit
  - .gitconfig
  - .gitignore
  - .gvimrc
  - .hushlogin
  - .inputrc
  - .macos
  - .p10k.zsh
  - .path
  - .sources
  - .tmux.conf.local
  - .vim
  - .vimrc
  - .wgetrc
  - .zprofile
  - .zshrc
  - .config/nvim

# Install Oh My Zsh
configure_oh_my_tmux: true

# Install Oh My Tmux
configure_oh_my_zsh: true

homebrew_packages_common:
  - git
  - gnupg
  - zsh
  - tmux
  - fzf
  - ripgrep
  - fd
  - bat
  - eza
  - zoxide
  - delta
  - jq
  - gh
  # neovim (LazyVim) setup
  - neovim
  - lazygit
  - tree-sitter-cli

homebrew_packages_macos:
  - coreutils
  - gnu-sed
  - grep
  - homebrew/cask/iterm2
  - homebrew/cask/claude-code
  - homebrew/cask/font-jetbrains-mono-nerd-font

# Packages installed with apt on Debian/Ubuntu (no homebrew on linux)
apt_packages:
  - build-essential
  - git
  - gnupg
  - zsh
  - tmux
  - fzf
  - ripgrep
  - fd-find
  - bat
  - zoxide
  - jq
  - gh
  - neovim
